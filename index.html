<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulation-First Space God Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050711;
      color: #dce7ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      width: min(390px, calc(100vw - 24px));
      padding: 12px 14px;
      border: 1px solid rgba(137, 174, 255, 0.32);
      border-radius: 12px;
      background: rgba(9, 14, 31, 0.82);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      user-select: none;
      pointer-events: none;
    }

    #hud h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    #stats, #controls {
      margin-top: 8px;
      white-space: pre-line;
      font-size: 13px;
      line-height: 1.35;
    }

    #status {
      color: #9ec5ff;
      font-size: 13px;
    }

    #controls {
      color: #aeb8d7;
    }
  </style>
</head>
<body>
<canvas id="sim"></canvas>
<section id="hud">
  <h1>Space God Prototype</h1>
  <div id="status"></div>
  <div id="stats"></div>
  <div id="controls"></div>
</section>

<script>
"use strict";

const canvas = document.getElementById("sim");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const statsEl = document.getElementById("stats");
const controlsEl = document.getElementById("controls");

const G = 6.67430e-11;
const METERS_PER_PIXEL = 1.0e6;
const MAX_STEP_SECONDS = 900;
const SOFTENING_METERS = 750;
const MAX_TRAIL_POINTS = 90;
const MIN_FRAGMENT_RADIUS_M = 5.0e4;
const MAX_FRAGMENTS = 10;
const MAX_BODIES = 160;
const COLLISION_CELL_SIZE_M = 8.0e6;
const FRAGMENT_REACCRETION_MASS_RATIO = 25;
const CREATE_MIN_RADIUS_M = 4.5e5;
const CREATE_MAX_RADIUS_M = 3.2e6;
const CREATE_RADIUS_RATE_MPS = 3.8e5;
const VELOCITY_DRAG_SCALE = 30;
const KEYBOARD_PAN_SPEED = 520;
const EARTH_MASS_KG = 5.9722e24;
const EARTH_RADIUS_M = 6.371e6;
const EARTH_DENSITY = 5514;

const materials = {
  earth_like: {
    label: "Earth Like",
    density: 5514,
    strength: 7.0e6,
    heatCapacity: 1000,
    color: [68, 126, 202]
  },
  rocky: {
    label: "Rocky",
    density: 3300,
    strength: 4.0e6,
    heatCapacity: 900,
    color: [164, 108, 64]
  },
  metal_rich: {
    label: "Metal Rich",
    density: 7800,
    strength: 1.0e7,
    heatCapacity: 460,
    color: [158, 163, 173]
  },
  icy: {
    label: "Icy",
    density: 920,
    strength: 8.0e5,
    heatCapacity: 2050,
    color: [168, 219, 255]
  }
};

const materialTypes = Object.keys(materials);

let nextBodyId = 1;
let bodies = [];
let selectedBody = null;
let paused = false;
let followSelected = false;
let timeScale = 3600;
let createMaterial = "rocky";
let lastFrameSeconds = performance.now() / 1000;

const camera = {
  x: 0,
  y: 0,
  zoom: 0.35
};

const pointer = {
  x: 0,
  y: 0,
  worldX: 0,
  worldY: 0,
  leftDown: false,
  middleDown: false,
  rightDown: false,
  panning: false,
  creating: false,
  createStartScreenX: 0,
  createStartScreenY: 0,
  createStartWorldX: 0,
  createStartWorldY: 0,
  createRadius: CREATE_MIN_RADIUS_M
};

const keys = new Set();

function resizeCanvas() {
  const dpr = Math.max(window.devicePixelRatio || 1, 1);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = `${window.innerWidth}px`;
  canvas.style.height = `${window.innerHeight}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function massFromRadius(radius, density) {
  return (4 / 3) * Math.PI * radius * radius * radius * density;
}

function radiusFromMass(mass, density) {
  return Math.pow((3 * mass) / (4 * Math.PI * density), 1 / 3);
}

function makeFragmentShape(seed) {
  const points = [];
  const count = 7 + (seed % 4);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count;
    const roughness = 0.68 + pseudoRandom(seed * 12.73 + i * 4.91) * 0.54;
    points.push({ angle, roughness });
  }
  return points;
}

function createBodyFromMass(name, x, y, vx, vy, mass, radius, materialType, density, isFragment = false) {
  const body = createBody(name, x, y, vx, vy, radius, materialType, isFragment);
  body.mass = mass;
  body.density = density;
  return body;
}

function createBody(name, x, y, vx, vy, radius, materialType, isFragment = false, addToWorld = true) {
  const material = materials[materialType] || materials.rocky;
  const body = {
    id: nextBodyId++,
    name,
    x,
    y,
    vx,
    vy,
    ax: 0,
    ay: 0,
    mass: massFromRadius(radius, material.density),
    radius,
    density: material.density,
    materialType,
    materialStrength: material.strength,
    heatCapacity: material.heatCapacity,
    temperature: 285,
    isFragment,
    craters: [],
    trail: [],
    lastTrailX: x,
    lastTrailY: y,
    shape: isFragment ? makeFragmentShape(nextBodyId) : null,
    spin: isFragment ? randomRange(-0.7, 0.7) : 0,
    angle: isFragment ? randomRange(0, Math.PI * 2) : 0,
    selected: false
  };
  if (addToWorld) bodies.push(body);
  return body;
}

function createFragment(parent, x, y, vx, vy, radius, temperature) {
  const fragment = createBody(`${parent.name} fragment`, x, y, vx, vy, radius, parent.materialType, true, false);
  fragment.temperature = temperature;
  fragment.craters = parent.craters.slice(-4);
  return fragment;
}

function screenToWorld(x, y) {
  return {
    x: camera.x + (x - window.innerWidth / 2) / camera.zoom,
    y: camera.y + (y - window.innerHeight / 2) / camera.zoom
  };
}

function worldToScreen(x, y) {
  return {
    x: (x - camera.x) * camera.zoom + window.innerWidth / 2,
    y: (y - camera.y) * camera.zoom + window.innerHeight / 2
  };
}

function simToWorld(body) {
  return {
    x: body.x / METERS_PER_PIXEL,
    y: body.y / METERS_PER_PIXEL
  };
}

function worldToSim(worldX, worldY) {
  return {
    x: worldX * METERS_PER_PIXEL,
    y: worldY * METERS_PER_PIXEL
  };
}

function renderRadius(body) {
  return Math.max((body.radius / METERS_PER_PIXEL) * camera.zoom, body.isFragment ? 2 : 4);
}

function pickBody(screenX, screenY) {
  let best = null;
  let bestDistance = Infinity;
  for (const body of bodies) {
    const world = simToWorld(body);
    const screen = worldToScreen(world.x, world.y);
    const dx = screenX - screen.x;
    const dy = screenY - screen.y;
    const distance = Math.hypot(dx, dy);
    const hitRadius = Math.max(renderRadius(body), 12);
    if (distance <= hitRadius && distance < bestDistance) {
      best = body;
      bestDistance = distance;
    }
  }
  return best;
}

function selectBody(body) {
  if (selectedBody) selectedBody.selected = false;
  selectedBody = body;
  if (selectedBody) selectedBody.selected = true;
}

function addHeat(body, energyJoules) {
  if (body.mass <= 0 || body.heatCapacity <= 0) return;
  body.temperature += energyJoules / (body.mass * body.heatCapacity);
}

function addCrater(body, dirX, dirY, severity) {
  const length = Math.hypot(dirX, dirY) || 1;
  body.craters.push({
    x: dirX / length,
    y: dirY / length,
    severity: Math.min(Math.max(severity, 0.05), 1)
  });
  while (body.craters.length > 18) body.craters.shift();
}

function gravitationalBindingEnergyPerKg(body) {
  // Uniform-sphere binding energy per unit mass: (3/5)GM/R.
  return (3 / 5) * G * body.mass / Math.max(body.radius, 1);
}

function escapeSpeedFrom(body, distance) {
  return Math.sqrt((2 * G * body.mass) / Math.max(distance, body.radius, 1));
}

function outwardFrom(centerBody, ejectaBody, fallbackX, fallbackY) {
  const dx = ejectaBody.x - centerBody.x;
  const dy = ejectaBody.y - centerBody.y;
  const length = Math.hypot(dx, dy);
  if (length > 0) return { x: dx / length, y: dy / length };
  return { x: fallbackX, y: fallbackY };
}

function disruptionEnergyPerKg(body) {
  // Q* approximation: material strength term plus self-gravity term. This is
  // closer to asteroid/planet impact scaling than comparing total energy alone,
  // while still cheap enough for a single-file browser sim.
  return (body.materialStrength / body.density) + gravitationalBindingEnergyPerKg(body);
}

function computeAccelerations() {
  for (const body of bodies) {
    body.ax = 0;
    body.ay = 0;
  }

  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    for (let j = i + 1; j < bodies.length; j++) {
      const b = bodies[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const rawDistSq = dx * dx + dy * dy;
      const distSq = Math.max(rawDistSq, SOFTENING_METERS * SOFTENING_METERS);
      const dist = Math.sqrt(distSq);
      if (dist <= 0) continue;
      const nx = dx / dist;
      const ny = dy / dist;
      const accelA = G * b.mass / distSq;
      const accelB = G * a.mass / distSq;
      a.ax += nx * accelA;
      a.ay += ny * accelA;
      b.ax -= nx * accelB;
      b.ay -= ny * accelB;
    }
  }
}

function integrateLeapfrog(dt) {
  // Kick-drift-kick leapfrog is a compact symplectic integrator. It is still an
  // approximation, but it handles fast-forwarded gravity better than explicit Euler.
  computeAccelerations();
  for (const body of bodies) {
    body.vx += body.ax * 0.5 * dt;
    body.vy += body.ay * 0.5 * dt;
    body.x += body.vx * dt;
    body.y += body.vy * dt;
  }
  computeAccelerations();
  for (const body of bodies) {
    body.vx += body.ax * 0.5 * dt;
    body.vy += body.ay * 0.5 * dt;
  }
}

function resolveCollisions() {
  const removed = new Set();
  const additions = [];
  const checkedPairs = new Set();
  const grid = buildCollisionGrid();

  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    if (removed.has(a)) continue;
    const nearby = nearbyCollisionCandidates(a, grid);
    for (const b of nearby) {
      if (a === b || removed.has(b)) continue;
      const lowId = Math.min(a.id, b.id);
      const highId = Math.max(a.id, b.id);
      const pairKey = `${lowId}:${highId}`;
      if (checkedPairs.has(pairKey)) continue;
      checkedPairs.add(pairKey);

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const distance = Math.hypot(dx, dy);
      if (distance <= a.radius + b.radius) {
        const result = solveCollision(a, b, distance || 1, dx, dy);
        for (const body of result.remove) removed.add(body);
        additions.push(...result.add);
        if (removed.has(a)) break;
      }
    }
  }

  bodies = bodies.filter((body) => !removed.has(body));
  bodies.push(...additions);
  enforceBodyBudget();
  if (selectedBody && !bodies.includes(selectedBody)) selectBody(null);
}

function buildCollisionGrid() {
  const grid = new Map();
  for (const body of bodies) {
    const cellX = Math.floor(body.x / COLLISION_CELL_SIZE_M);
    const cellY = Math.floor(body.y / COLLISION_CELL_SIZE_M);
    const key = `${cellX}:${cellY}`;
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(body);
  }
  return grid;
}

function nearbyCollisionCandidates(body, grid) {
  const candidates = [];
  const cellX = Math.floor(body.x / COLLISION_CELL_SIZE_M);
  const cellY = Math.floor(body.y / COLLISION_CELL_SIZE_M);
  const reach = Math.max(1, Math.ceil(body.radius / COLLISION_CELL_SIZE_M) + 1);
  for (let x = cellX - reach; x <= cellX + reach; x++) {
    for (let y = cellY - reach; y <= cellY + reach; y++) {
      const bucket = grid.get(`${x}:${y}`);
      if (bucket) candidates.push(...bucket);
    }
  }
  return candidates;
}

function solveCollision(a, b, distance, dx, dy) {
  const nx = dx / distance;
  const ny = dy / distance;
  const rvx = b.vx - a.vx;
  const rvy = b.vy - a.vy;
  const closingSpeed = Math.max(-(rvx * nx + rvy * ny), Math.hypot(rvx, rvy));
  const reducedMass = (a.mass * b.mass) / Math.max(a.mass + b.mass, 1);
  const energy = 0.5 * reducedMass * closingSpeed * closingSpeed;
  const smaller = a.mass <= b.mass ? a : b;
  const larger = smaller === a ? b : a;
  const specificImpactEnergy = energy / Math.max(smaller.mass, 1);
  const disruptionThreshold = disruptionEnergyPerKg(smaller);
  const severity = specificImpactEnergy / Math.max(disruptionThreshold, 1);
  const impactParameter = Math.abs((rvx * -ny) + (rvy * nx)) / Math.max(closingSpeed, 1);
  const result = {
    remove: [],
    add: [],
    x: (a.x + b.x) * 0.5,
    y: (a.y + b.y) * 0.5,
    energy,
    severity,
    specificImpactEnergy,
    disruptionThreshold
  };

  if (smaller.isFragment && larger.mass > smaller.mass * FRAGMENT_REACCRETION_MASS_RATIO) {
    fallbackFragmentImpact(larger, smaller, nx, ny, energy, severity, result);
    return result;
  }

  if (closingSpeed < 0.25 || severity < 0.08) {
    mergeBodies(a, b, result);
  } else if (severity < 0.45 || impactParameter > 0.65) {
    craterImpact(a, b, nx, ny, severity, energy);
  } else if (severity < 1.6) {
    fragmentEjection(a, b, nx, ny, severity, energy, result, smaller);
  } else {
    catastrophicShatter(a, b, nx, ny, severity, energy, result, smaller, larger);
  }

  return result;
}

function enforceBodyBudget() {
  if (bodies.length <= MAX_BODIES) return;
  const protectedBodies = new Set(selectedBody ? [selectedBody] : []);
  bodies.sort((a, b) => {
    if (protectedBodies.has(a)) return -1;
    if (protectedBodies.has(b)) return 1;
    return b.mass - a.mass;
  });
  bodies = bodies.slice(0, MAX_BODIES);
  if (selectedBody && !bodies.includes(selectedBody)) selectBody(null);
}

function mergeBodies(a, b, result) {
  const primary = a.mass >= b.mass ? a : b;
  const secondary = primary === a ? b : a;
  const totalMass = primary.mass + secondary.mass;
  const mixedDensity = totalMass / ((primary.mass / primary.density) + (secondary.mass / secondary.density));
  primary.vx = (primary.vx * primary.mass + secondary.vx * secondary.mass) / totalMass;
  primary.vy = (primary.vy * primary.mass + secondary.vy * secondary.mass) / totalMass;
  primary.x = (primary.x * primary.mass + secondary.x * secondary.mass) / totalMass;
  primary.y = (primary.y * primary.mass + secondary.y * secondary.mass) / totalMass;
  primary.mass = totalMass;
  primary.density = mixedDensity;
  primary.radius = radiusFromMass(totalMass, mixedDensity);
  addHeat(primary, result.energy * 0.25);
  addCrater(primary, secondary.x - primary.x, secondary.y - primary.y, Math.min(result.severity, 1));
  result.remove.push(secondary);
}

function craterImpact(a, b, nx, ny, severity, energy) {
  addCrater(a, nx, ny, severity);
  addCrater(b, -nx, -ny, severity);
  addHeat(a, energy * 0.08);
  addHeat(b, energy * 0.08);
  bounceBodies(a, b, nx, ny, 0.18);
}

function fallbackFragmentImpact(planet, fragment, nx, ny, energy, severity, result) {
  const dirX = fragment.x - planet.x;
  const dirY = fragment.y - planet.y;
  const totalMass = planet.mass + fragment.mass;
  addCrater(planet, dirX, dirY, clamp(severity, 0.08, 1));
  addHeat(planet, energy * 0.18);
  planet.vx = (planet.vx * planet.mass + fragment.vx * fragment.mass) / totalMass;
  planet.vy = (planet.vy * planet.mass + fragment.vy * fragment.mass) / totalMass;
  planet.mass = totalMass;
  planet.radius = radiusFromMass(planet.mass, planet.density);
  result.remove.push(fragment);
}

function fragmentEjection(a, b, nx, ny, severity, energy, result, sourceOverride = null) {
  craterImpact(a, b, nx, ny, severity, energy);
  const source = sourceOverride || (a.mass <= b.mass ? a : b);
  const target = source === a ? b : a;
  const outward = outwardFrom(target, source, nx, ny);
  const fragmentCount = clamp(Math.ceil(2 + severity * 2.2), 2, MAX_FRAGMENTS);
  const ejectedMassTotal = source.mass * clamp(0.02 + severity * 0.05, 0.03, 0.18);
  const localEscape = escapeSpeedFrom(target, target.radius + source.radius);
  source.mass -= ejectedMassTotal;
  source.radius = radiusFromMass(source.mass, source.density);

  for (let i = 0; i < fragmentCount; i++) {
    const angle = Math.atan2(outward.y, outward.x) + randomRange(-0.55, 0.55);
    const dirX = Math.cos(angle);
    const dirY = Math.sin(angle);
    const fragmentMass = ejectedMassTotal / fragmentCount;
    const fragmentRadius = Math.max(radiusFromMass(fragmentMass, source.density), MIN_FRAGMENT_RADIUS_M);
    // Most ejecta is launched below escape speed, so it falls back instead of orbiting forever.
    const speed = localEscape * (0.28 + 0.42 * pseudoRandom(source.id * 17.3 + i));
    result.add.push(createFragment(
      source,
      source.x + dirX * (source.radius + fragmentRadius + 1),
      source.y + dirY * (source.radius + fragmentRadius + 1),
      target.vx + dirX * speed,
      target.vy + dirY * speed,
      fragmentRadius,
      source.temperature + 80
    ));
  }
}

function catastrophicShatter(a, b, nx, ny, severity, energy, result, victimOverride = null, survivorOverride = null) {
  const victim = victimOverride || (a.mass <= b.mass ? a : b);
  const survivor = survivorOverride || (victim === a ? b : a);
  const outward = outwardFrom(survivor, victim, nx, ny);
  addCrater(survivor, -outward.x, -outward.y, 1);
  addHeat(survivor, energy * 0.12);
  result.remove.push(victim);

  const fragmentCount = clamp(Math.ceil(4 + severity * 1.7), 4, MAX_FRAGMENTS);
  const retainedMass = victim.mass * clamp(0.24 / Math.max(severity, 1), 0.04, 0.18);
  const fragmentMassTotal = victim.mass - retainedMass;
  const localEscape = escapeSpeedFrom(survivor, survivor.radius + victim.radius);
  for (let i = 0; i < fragmentCount; i++) {
    const angle = Math.atan2(outward.y, outward.x) + randomRange(-0.9, 0.9);
    const dirX = Math.cos(angle);
    const dirY = Math.sin(angle);
    const fragmentMass = fragmentMassTotal / fragmentCount;
    const fragmentRadius = Math.max(radiusFromMass(fragmentMass, victim.density), MIN_FRAGMENT_RADIUS_M);
    const escapeFraction = 0.45 + 0.55 * pseudoRandom(victim.id * 23.7 + i);
    const severeEscapeBoost = severity > 3 ? clamp((severity - 3) * 0.12, 0, 0.45) : 0;
    const speed = localEscape * Math.min(escapeFraction + severeEscapeBoost, 1.35);
    result.add.push(createFragment(
      victim,
      victim.x + dirX * (victim.radius + fragmentRadius),
      victim.y + dirY * (victim.radius + fragmentRadius),
      victim.vx + dirX * speed,
      victim.vy + dirY * speed,
      fragmentRadius,
      victim.temperature + 180
    ));
  }

  const totalMass = survivor.mass + retainedMass;
  survivor.vx = (survivor.vx * survivor.mass + victim.vx * retainedMass) / totalMass;
  survivor.vy = (survivor.vy * survivor.mass + victim.vy * retainedMass) / totalMass;
  survivor.mass = totalMass;
  survivor.radius = radiusFromMass(survivor.mass, survivor.density);
}

function bounceBodies(a, b, nx, ny, restitution) {
  const rvx = b.vx - a.vx;
  const rvy = b.vy - a.vy;
  const normalSpeed = rvx * nx + rvy * ny;
  if (normalSpeed > 0) return;
  const impulse = -(1 + restitution) * normalSpeed / ((1 / a.mass) + (1 / b.mass));
  a.vx -= nx * impulse / a.mass;
  a.vy -= ny * impulse / a.mass;
  b.vx += nx * impulse / b.mass;
  b.vy += ny * impulse / b.mass;
}

function simulate(realDelta) {
  if (paused) return;
  let remaining = realDelta * timeScale;
  while (remaining > 0) {
    const step = Math.min(remaining, MAX_STEP_SECONDS);
    integrateLeapfrog(step);
    resolveCollisions();
    remaining -= step;
  }

  updateFragmentSpin(realDelta);
  updateTrails();
}

function updateTrails() {
  for (const body of bodies) {
    const moved = Math.hypot(body.lastTrailX - body.x, body.lastTrailY - body.y);
    if (body.trail.length === 0 || moved > body.radius * 0.35) {
      body.trail.push({ x: body.x, y: body.y });
      body.lastTrailX = body.x;
      body.lastTrailY = body.y;
      while (body.trail.length > MAX_TRAIL_POINTS) body.trail.shift();
    }
  }
}

function updateFragmentSpin(delta) {
  for (const body of bodies) {
    if (body.isFragment) body.angle += body.spin * delta;
  }
}

function updateInput(delta) {
  if (followSelected && selectedBody) {
    const world = simToWorld(selectedBody);
    camera.x = world.x;
    camera.y = world.y;
  }

  const pan = { x: 0, y: 0 };
  if (keys.has("a") || keys.has("arrowleft")) pan.x -= 1;
  if (keys.has("d") || keys.has("arrowright")) pan.x += 1;
  if (keys.has("w") || keys.has("arrowup")) pan.y -= 1;
  if (keys.has("s") || keys.has("arrowdown")) pan.y += 1;
  if (pan.x || pan.y) {
    const length = Math.hypot(pan.x, pan.y);
    camera.x += (pan.x / length) * KEYBOARD_PAN_SPEED * delta / camera.zoom;
    camera.y += (pan.y / length) * KEYBOARD_PAN_SPEED * delta / camera.zoom;
  }

  if (pointer.creating) {
    pointer.createRadius = Math.min(pointer.createRadius + CREATE_RADIUS_RATE_MPS * delta, CREATE_MAX_RADIUS_M);
  }

}

function draw() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  drawBackground();

  for (const body of bodies) drawTrail(body);
  for (const body of bodies) drawBody(body);
  if (pointer.creating) drawCreationPreview();
  updateHud();
}

function drawBackground() {
  const gradient = ctx.createRadialGradient(
    window.innerWidth * 0.5,
    window.innerHeight * 0.45,
    0,
    window.innerWidth * 0.5,
    window.innerHeight * 0.5,
    Math.max(window.innerWidth, window.innerHeight)
  );
  gradient.addColorStop(0, "#0c1430");
  gradient.addColorStop(1, "#03050d");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  ctx.fillStyle = "rgba(190, 215, 255, 0.28)";
  for (let i = 0; i < 90; i++) {
    const x = pseudoRandom(i * 19.17) * window.innerWidth;
    const y = pseudoRandom(i * 42.91) * window.innerHeight;
    ctx.fillRect(x, y, 1, 1);
  }
}

function drawTrail(body) {
  if (body.isFragment) return;
  if (body.trail.length < 2) return;
  ctx.lineWidth = 1;
  for (let i = 1; i < body.trail.length; i++) {
    const a = worldToScreen(body.trail[i - 1].x / METERS_PER_PIXEL, body.trail[i - 1].y / METERS_PER_PIXEL);
    const b = worldToScreen(body.trail[i].x / METERS_PER_PIXEL, body.trail[i].y / METERS_PER_PIXEL);
    const alpha = (i / body.trail.length) * 0.35;
    ctx.strokeStyle = `rgba(120, 180, 255, ${alpha})`;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
}

function drawBody(body) {
  const material = materials[body.materialType] || materials.rocky;
  const screen = worldToScreen(body.x / METERS_PER_PIXEL, body.y / METERS_PER_PIXEL);
  const radius = renderRadius(body);
  const heat = clamp((body.temperature - 900) / 1800, 0, 1);
  const base = mixColor(material.color, [255, 88, 16], heat);
  const dark = mixColor(base, [0, 0, 0], 0.35);
  const light = mixColor(base, [255, 255, 255], 0.45);

  if (body.isFragment) {
    drawFragmentBody(body, screen.x, screen.y, radius, base, dark);
    if (body.selected) drawSelectionCorners(screen.x, screen.y, radius);
    return;
  }

  ctx.fillStyle = rgb(dark);
  ctx.beginPath();
  ctx.arc(screen.x, screen.y, radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = rgb(base);
  ctx.beginPath();
  ctx.arc(screen.x - radius * 0.28, screen.y - radius * 0.35, radius * 0.82, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = rgb(light);
  ctx.beginPath();
  ctx.arc(screen.x - radius * 0.46, screen.y - radius * 0.53, radius * 0.24, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(8, 7, 5, 0.7)";
  for (const crater of body.craters) {
    ctx.beginPath();
    ctx.arc(
      screen.x + crater.x * radius * 0.48,
      screen.y + crater.y * radius * 0.48,
      radius * lerp(0.07, 0.2, crater.severity),
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  if (body.selected) {
    drawSelectionCorners(screen.x, screen.y, radius);
  }
}

function drawFragmentBody(body, x, y, radius, base, dark) {
  const points = body.shape || makeFragmentShape(body.id);
  ctx.fillStyle = rgb(dark);
  ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const point = points[i];
    const angle = point.angle + body.angle;
    const rockRadius = radius * point.roughness;
    const px = x + Math.cos(angle) * rockRadius;
    const py = y + Math.sin(angle) * rockRadius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = rgb(base);
  ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const point = points[i];
    const angle = point.angle + body.angle - 0.25;
    const rockRadius = radius * point.roughness * 0.68;
    const px = x - radius * 0.16 + Math.cos(angle) * rockRadius;
    const py = y - radius * 0.18 + Math.sin(angle) * rockRadius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawSelectionCorners(x, y, radius) {
  const gap = radius + 6;
  const length = 8;
  ctx.strokeStyle = "rgba(145, 205, 255, 0.9)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - gap, y - gap + length);
  ctx.lineTo(x - gap, y - gap);
  ctx.lineTo(x - gap + length, y - gap);
  ctx.moveTo(x + gap - length, y - gap);
  ctx.lineTo(x + gap, y - gap);
  ctx.lineTo(x + gap, y - gap + length);
  ctx.moveTo(x - gap, y + gap - length);
  ctx.lineTo(x - gap, y + gap);
  ctx.lineTo(x - gap + length, y + gap);
  ctx.moveTo(x + gap - length, y + gap);
  ctx.lineTo(x + gap, y + gap);
  ctx.lineTo(x + gap, y + gap - length);
  ctx.stroke();
}

function drawCreationPreview() {
  const start = worldToScreen(pointer.createStartWorldX, pointer.createStartWorldY);
  const radius = Math.max((pointer.createRadius / METERS_PER_PIXEL) * camera.zoom, 4);
  const color = materials[createMaterial].color;
  ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.38)`;
  ctx.beginPath();
  ctx.arc(start.x, start.y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(210, 220, 230, 0.65)";
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.rect(start.x - radius, start.y - radius, radius * 2, radius * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = "rgba(180, 190, 180, 0.85)";
  ctx.beginPath();
  ctx.moveTo(start.x, start.y);
  ctx.lineTo(pointer.x, pointer.y);
  ctx.stroke();
}

function updateHud() {
  statusEl.textContent = `${paused ? "Paused" : "Running"} | time scale ${timeScale.toFixed(1)}x | creating ${materials[createMaterial].label} | bodies ${bodies.length}`;
  if (!selectedBody) {
    statsEl.textContent = "Selected body: none\nModel: N-body gravity + Q* impact approximation";
  } else {
    const qStar = disruptionEnergyPerKg(selectedBody);
    const binding = gravitationalBindingEnergyPerKg(selectedBody);
    statsEl.textContent = [
      `Selected: ${selectedBody.name} (#${selectedBody.id})`,
      `Material: ${selectedBody.materialType}${selectedBody.isFragment ? " fragment" : ""}`,
      `Mass: ${formatSci(selectedBody.mass)} kg`,
      `Radius: ${selectedBody.radius.toFixed(1)} m`,
      `Density: ${selectedBody.density.toFixed(0)} kg/m^3`,
      `Speed: ${Math.hypot(selectedBody.vx, selectedBody.vy).toFixed(2)} m/s`,
      `Acceleration: ${Math.hypot(selectedBody.ax, selectedBody.ay).toExponential(3)} m/s^2`,
      `Temperature: ${selectedBody.temperature.toFixed(1)} K`,
      `Q*: ${qStar.toExponential(3)} J/kg`,
      `Binding: ${binding.toExponential(3)} J/kg`,
      `Craters: ${selectedBody.craters.length}`
    ].join("\n");
  }
  controlsEl.textContent = [
    "LMB select | hold empty space to grow body | drag to set velocity",
    "WASD/arrows or MMB/RMB drag pan | wheel zoom | Space pause",
    "F follow selected | 1-4 presets | 5 Earth impact | [/] time scale | Tab material | R reset camera"
  ].join("\n");
}

function frame(nowMs) {
  const nowSeconds = nowMs / 1000;
  const delta = Math.min(nowSeconds - lastFrameSeconds, 0.05);
  lastFrameSeconds = nowSeconds;
  updateInput(delta);
  simulate(delta);
  draw();
  requestAnimationFrame(frame);
}

canvas.addEventListener("contextmenu", (event) => event.preventDefault());

canvas.addEventListener("pointermove", (event) => {
  const prevX = pointer.x;
  const prevY = pointer.y;
  pointer.x = event.clientX;
  pointer.y = event.clientY;
  const world = screenToWorld(pointer.x, pointer.y);
  pointer.worldX = world.x;
  pointer.worldY = world.y;

  if (pointer.panning) {
    camera.x -= (pointer.x - prevX) / camera.zoom;
    camera.y -= (pointer.y - prevY) / camera.zoom;
  }
});

canvas.addEventListener("pointerdown", (event) => {
  canvas.setPointerCapture(event.pointerId);
  pointer.x = event.clientX;
  pointer.y = event.clientY;
  const world = screenToWorld(pointer.x, pointer.y);
  pointer.worldX = world.x;
  pointer.worldY = world.y;

  if (event.button === 0) {
    const picked = pickBody(pointer.x, pointer.y);
    if (picked) {
      selectBody(picked);
    } else {
      pointer.creating = true;
      pointer.createStartScreenX = pointer.x;
      pointer.createStartScreenY = pointer.y;
      pointer.createStartWorldX = pointer.worldX;
      pointer.createStartWorldY = pointer.worldY;
      pointer.createRadius = CREATE_MIN_RADIUS_M;
    }
  } else if (event.button === 1 || event.button === 2) {
    pointer.panning = true;
  }
});

canvas.addEventListener("pointerup", (event) => {
  if (event.button === 0 && pointer.creating) {
    const dragX = pointer.x - pointer.createStartScreenX;
    const dragY = pointer.y - pointer.createStartScreenY;
    const simPos = worldToSim(pointer.createStartWorldX, pointer.createStartWorldY);
    const body = createBody(
      `${createMaterial} body ${bodies.length + 1}`,
      simPos.x,
      simPos.y,
      dragX * VELOCITY_DRAG_SCALE,
      dragY * VELOCITY_DRAG_SCALE,
      pointer.createRadius,
      createMaterial,
      false
    );
    selectBody(body);
    pointer.creating = false;
  }
  if (event.button === 1 || event.button === 2) pointer.panning = false;
});

canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  const before = screenToWorld(event.clientX, event.clientY);
  const factor = event.deltaY < 0 ? 1.16 : 0.86;
  camera.zoom = clamp(camera.zoom * factor, 0.08, 10);
  const after = screenToWorld(event.clientX, event.clientY);
  camera.x += before.x - after.x;
  camera.y += before.y - after.y;
}, { passive: false });

window.addEventListener("keydown", (event) => {
  const key = event.key.toLowerCase();
  keys.add(key);
  if (event.repeat) return;
  if (key === " ") {
    paused = !paused;
    event.preventDefault();
  } else if (key === "f") {
    followSelected = !followSelected;
  } else if (key === "1") {
    timeScale = 1;
  } else if (key === "2") {
    timeScale = 60;
  } else if (key === "3") {
    timeScale = 600;
  } else if (key === "4") {
    timeScale = 3600;
  } else if (key === "5") {
    loadEarthImpactScenario();
  } else if (key === "[") {
    timeScale = Math.max(timeScale / 2, 1);
  } else if (key === "]") {
    timeScale = Math.min(timeScale * 2, 100000);
  } else if (key === "tab") {
    event.preventDefault();
    const currentIndex = materialTypes.indexOf(createMaterial);
    createMaterial = materialTypes[(currentIndex + 1) % materialTypes.length];
  } else if (key === "r") {
    camera.x = 0;
    camera.y = 0;
    camera.zoom = 0.35;
  } else if (key === "escape") {
    selectBody(null);
  }
});

window.addEventListener("keyup", (event) => {
  keys.delete(event.key.toLowerCase());
});

window.addEventListener("resize", resizeCanvas);

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function randomRange(min, max) {
  return min + Math.random() * (max - min);
}

function mixColor(a, b, t) {
  return [
    Math.round(lerp(a[0], b[0], t)),
    Math.round(lerp(a[1], b[1], t)),
    Math.round(lerp(a[2], b[2], t))
  ];
}

function rgb(color) {
  return `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
}

function formatSci(value) {
  return value.toExponential(3);
}

function pseudoRandom(seed) {
  return Math.abs(Math.sin(seed) * 43758.5453123) % 1;
}

function seedStartingBodies() {
  const primary = createBody("Rocky Proto-Planet", -9.0e6, 0, 0, 18, 2.5e6, "rocky", false);
  createBody("Icy Proto-Planet", 9.0e6, 0, 0, -18, 2.0e6, "icy", false);
  selectBody(primary);
}

function loadEarthImpactScenario() {
  bodies = [];
  nextBodyId = 1;
  camera.x = 0;
  camera.y = 0;
  camera.zoom = 0.28;
  timeScale = 60;

  const earth = createBodyFromMass(
    "Earth analog",
    0,
    0,
    0,
    0,
    EARTH_MASS_KG,
    EARTH_RADIUS_M,
    "earth_like",
    EARTH_DENSITY
  );
  earth.temperature = 288;

  const asteroidRadius = 5.0e5;
  const startDistance = EARTH_RADIUS_M + asteroidRadius + 1.8e7;
  const impactSpeed = 20000; // Typical large near-Earth asteroid impact speed.
  createBody(
    "500 km rocky asteroid",
    -startDistance,
    -2.1e6,
    impactSpeed,
    1500,
    asteroidRadius,
    "rocky",
    false
  );
  selectBody(earth);
}

resizeCanvas();
seedStartingBodies();
requestAnimationFrame(frame);
</script>
</body>
</html>
